# From this directory: docker compose up --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DLC_PROFILE: startup
      DLC_PROVIDER: mock
      DLC_CONFIG: examples/nestjs-crud.yaml
      DLC_OUTPUT_ROOT: output
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/live').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
