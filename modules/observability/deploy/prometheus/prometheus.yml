global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: study-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:3000"]
  - job_name: study-catalog
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog:3001"]
