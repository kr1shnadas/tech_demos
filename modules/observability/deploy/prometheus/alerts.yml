groups:
  - name: study-checks
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum by (service) (rate(http_errors_total[5m]))
            /
            sum by (service) (rate(http_requests_total[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: HTTP error rate is above 5% for {{ $labels.service }}
          description: More than one in twenty requests finished with status 500 or higher over the last five minutes.
      - alert: HighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: p95 latency is above 500ms for {{ $labels.service }}
          description: The 95th percentile of HTTP request duration has stayed above half a second for two minutes.
