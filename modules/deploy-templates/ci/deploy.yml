#
# Template. Copy this file to .github/workflows/deploy.yml in the service
# repository. It lives in ci/ so this portfolio does not run it and does
# not need an AWS role. Paths below assume the module is the repository root.
#
# Repository variables:
#   AWS_DEPLOY_ROLE_ARN   role the job assumes (required)
#   TF_STATE_BUCKET       S3 bucket for Terraform state (required)
#   AWS_REGION            optional, default us-east-1
#   SERVICE_NAME          optional, default deploy-demo
#   ENVIRONMENT_NAME      optional, default dev
#   IMAGE_TAG_STRATEGY    optional: git-sha, semver or latest
#   ENABLE_LAMBDA         optional: true or false

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME }}
  ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
  IMAGE_TAG_STRATEGY: ${{ vars.IMAGE_TAG_STRATEGY }}
  ENABLE_LAMBDA: ${{ vars.ENABLE_LAMBDA }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  image:
    name: Push the image to ECR
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require the deploy role and the state bucket
        run: |
          set -eu
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "Set the repository variable AWS_DEPLOY_ROLE_ARN."
            exit 1
          fi
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "Set the repository variable TF_STATE_BUCKET."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install

      - name: Choose the image tag
        id: tag
        run: |
          set -eu
          strategy="${IMAGE_TAG_STRATEGY:-git-sha}"
          case "$strategy" in
            semver)
              tag="$(node -p "require('./package.json').version")"
              ;;
            latest)
              tag="latest"
              ;;
            git-sha)
              tag="$GITHUB_SHA"
              ;;
            *)
              echo "IMAGE_TAG_STRATEGY must be git-sha, semver or latest."
              exit 1
              ;;
          esac
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Write tfvars and create the repository
        run: |
          set -eu
          if [ -n "$AWS_REGION" ]; then export DEPLOY_REGION="$AWS_REGION"; fi
          if [ -n "$SERVICE_NAME" ]; then export DEPLOY_SERVICE_NAME="$SERVICE_NAME"; fi
          if [ -n "$ENVIRONMENT_NAME" ]; then export DEPLOY_ENVIRONMENT="$ENVIRONMENT_NAME"; fi
          if [ -n "$IMAGE_TAG_STRATEGY" ]; then export DEPLOY_IMAGE_TAG_STRATEGY="$IMAGE_TAG_STRATEGY"; fi
          if [ -n "$ENABLE_LAMBDA" ]; then export DEPLOY_ENABLE_LAMBDA="$ENABLE_LAMBDA"; fi
          export DEPLOY_IMAGE_TAG="${{ steps.tag.outputs.image_tag }}"
          pnpm tfvars
          region="${AWS_REGION:-us-east-1}"
          service="${SERVICE_NAME:-deploy-demo}"
          environment="${ENVIRONMENT_NAME:-dev}"
          cp terraform/examples/backend.s3.tf terraform/backend.tf
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${service}/${environment}/terraform.tfstate" \
            -backend-config="region=${region}" \
            -backend-config="use_lockfile=true"
          terraform -chdir=terraform apply -input=false -auto-approve -target=module.ecr

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          set -eu
          repo="$(terraform -chdir=terraform output -raw ecr_repository_url)"
          tag="${{ steps.tag.outputs.image_tag }}"
          docker build --platform linux/amd64 -t "$repo:$tag" .
          docker push "$repo:$tag"

  deploy:
    name: Deploy
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Write tfvars from the config
        run: |
          set -eu
          if [ -n "$AWS_REGION" ]; then export DEPLOY_REGION="$AWS_REGION"; fi
          if [ -n "$SERVICE_NAME" ]; then export DEPLOY_SERVICE_NAME="$SERVICE_NAME"; fi
          if [ -n "$ENVIRONMENT_NAME" ]; then export DEPLOY_ENVIRONMENT="$ENVIRONMENT_NAME"; fi
          if [ -n "$IMAGE_TAG_STRATEGY" ]; then export DEPLOY_IMAGE_TAG_STRATEGY="$IMAGE_TAG_STRATEGY"; fi
          if [ -n "$ENABLE_LAMBDA" ]; then export DEPLOY_ENABLE_LAMBDA="$ENABLE_LAMBDA"; fi
          export DEPLOY_IMAGE_TAG="${{ needs.image.outputs.image_tag }}"
          pnpm tfvars

      - name: Apply
        run: |
          set -eu
          region="${AWS_REGION:-us-east-1}"
          service="${SERVICE_NAME:-deploy-demo}"
          environment="${ENVIRONMENT_NAME:-dev}"
          cp terraform/examples/backend.s3.tf terraform/backend.tf
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${service}/${environment}/terraform.tfstate" \
            -backend-config="region=${region}" \
            -backend-config="use_lockfile=true"
          terraform -chdir=terraform apply -input=false -auto-approve
