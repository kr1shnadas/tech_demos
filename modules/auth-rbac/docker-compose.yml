# Optional Keycloak. The demo itself does not need this file.
# From this directory: docker compose up
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./demo/keycloak/study-realm.json:/opt/keycloak/data/import/study-realm.json:ro
